rainbow:{cur:1,v:"raindropModelSupported",cols:["Experiments","Readings & auxiliaries","Laws","Predictions","Corroboration","Verdict & rivals"],
 ttl:`Why Rainbows Work: an Evidence Hypergraph`,sub:`Evidence graph of <code>Scilib.Rainbow</code>, formalized in Lean&nbsp;4`,abs:`<b>Abstract</b>Nine experiments are read as nine observations, generalized with auxiliary hypotheses into five laws, combined into seven predictions of the raindrop model, and checked against the sky. Two rivals, <i>simpleMirrorModel</i> and <i>pureRayOptics</i>, are refuted. Click any reading or auxiliary to remove it from the granted set and see which conclusions stop following (the Duhem&ndash;Quine effect). Hover anything for its statement.`,cap:`<b>Figure 1:</b> Directed hypergraph of the rainbow argument. Each square is a hyperedge: hollow squares are <i>interprets</i> (experiment &rarr; reading), filled squares are <i>entails</i> (all premises &rarr; conclusion). Faded elements are not derived from the current granted set. Red dashed lines are contradictions; the red square is a nogood set. A red outline marks a conflict, and a red experiment is refuted.`,T:`e1|0|70|reflectionExperiment|Beams on a plane mirror: equal angles for every colour

magnus:{cur:5,v:"magnusBeatsRivals",cols:["Experiments","Readings & auxiliaries","Laws","Mechanism","Force & predictions","Verdict & rivals"],
 ttl:`Why the Magnus Effect Works: an Evidence Hypergraph`,sub:`Evidence graph of <code>Scilib.Magnus</code>, formalized in Lean&nbsp;4`,abs:`<b>Abstract</b>Six experiments (tennis and musket balls, Magnus’s cylinder, pressure taps, a wind tunnel, a rotor ship) are read as six observations and combined with twelve laws and auxiliaries into one circulation model. Three independent routes (pressure, circulation, momentum) reach the same sideways force. Three rivals, <i>spinIrrelevantModel</i>, <i>noCirculationFlow</i> and <i>idealLiftIsExact</i>, are refuted. Click any reading, law or auxiliary to remove it from the granted set and see which conclusions stop following (the Duhem&ndash;Quine effect). Hover anything for its statement.`,cap:`<b>Figure 1:</b> Directed hypergraph of the Magnus argument. Each square is a hyperedge: hollow squares are <i>interprets</i> (experiment &rarr; reading), filled squares are <i>entails</i> (all premises &rarr; conclusion). Faded elements are not derived from the current granted set. Red dashed lines are contradictions. A red outline marks a conflict, and a red experiment is refuted.`,T:`e1|0|70|tennisBallExperiment|Spun tennis balls: topspin dips, backspin floats, sidespin drifts
e2|0|125|musketBallExperiment|Musket balls land well off the aim line, side set by the barrel
e3|0|180|magnusCylinderExperiment|Spinning brass cylinder in an air blast: frame swings sideways
e4|0|235|surfacePressureExperiment|Pressure taps: lower on the side moving with the stream
e5|0|298|windTunnelLiftExperiment|Force coefficient rises with spin ratio, then levels off
e6|0|370|flettnerRotorShipExperiment|Spinning cylinders drive a ship across the wind; reversing spin reverses it
r1|1|97|spinDeflectsBallReading|Flight path departs from an unspun ball, direction set by spin sense
r2|1|180|sidewaysForceReading|Push perpendicular to flow and axis; reverses with the spin
r3|1|235|surfacePressureReading|Lower pressure on the side moving with the oncoming stream
r4|1|275|liftRisesWithSpinReading|Force grows with surface speed relative to stream speed
r5|1|320|liftFlattensBelowIdealReading|At high spin ratio lift levels off below the ideal 2πS
r6|1|370|rotorShipThrustReading|Vertical spinning cylinders give thrust across the wind
a1|1|450|attachedBoundaryLayer|Boundary layer stays attached long enough to carry the spin outward
a2|1|492|outerFlowIdeal|Outside the boundary layer: steady, inviscid, incompressible
a3|1|534|ballForceBalance|Short flight: constant mass; gravity, drag and spin force
a4|1|576|verticalRotorsInCrosswind|Ship cylinders spin about vertical axes in a steady horizontal wind
a5|1|618|separationLimitsLift|Separation and end effects cut real lift below the ideal value
a6|1|660|explanatoryCriterion|Prefer the model that explains independent data without contradiction
a7|2|70|noSlipCondition|Fluid touching a surface moves with that surface
a8|2|135|bernoulliPrinciple|Steady inviscid flow: faster means lower pressure
a9|2|200|kuttaJoukowski|Force per unit length L′ = ρUΓ, perpendicular to the stream
a10|2|265|surfaceSpeedIsOmegaR|A surface point of a spinning cylinder moves at ωR
a11|2|330|newtonSecondLaw|Net force equals rate of change of momentum
a12|2|395|newtonThirdLaw|The fluid pushes back on the body equally and oppositely
p1|3|80|circulationAroundSpinner|A spinning body drags fluid round and sets up circulation Γ
p2|3|150|speedAsymmetry|Flow is faster where the surface moves with the stream
p3|3|220|lowerPressureOnFastSide|Lower pressure on the faster-flow side
p4|3|290|pressureForceTowardFastSide|Net pressure force points to the faster-flow side
p5|3|360|streamDeflection|Circulation turns the stream to one side
p6|3|430|rigidRotationCirculation|Γ = 2πωR² for a cylinder of radius R spinning at ω
p7|4|110|idealMagnusLift|L′ = 2πρUωR², so C_L = 2πS with S = ωR/U
p8|4|230|magnusForce|Force perpendicular to stream and axis, toward the side moving with the stream
p9|4|350|curvedFlightPrediction|Spun balls follow curved paths
p10|4|450|flettnerThrust|Vertical spun cylinders push a ship across the wind

 pre:()=>{const PH=["a7","a1","a8","a2","a9","a10","a11","a12","a3","a4","a5"],CB=PH.concat(["r1","r2","r3","r6","r4","a6"]);const PRE=[["pressure route",["a7","a1","a8","a2"]],["circulation route",["a7","a1","a9","a2"]],["momentum route",["a7","a1","a11","a12"]],["lift formula",["a7","a1","a10","a9","a2"]],["all physics",PH],["combined evidence",CB],["combined + spinIrrelevantModel",CB.concat("m1")],["combined + noCirculationFlow",CB.concat("m2")],["combined + idealLiftIsExact",CB.concat("m3")]];return [PRE,CB]}}

 abs:`<b>Abstract</b>Seven experiments (films in white and single-wavelength light, the black film, viewing angle, Newton’s rings, transmission, Lloyd’s mirror) are read as seven observations. Twelve granted laws and set-ups give two derived interference conditions and one unified theory. Young’s inference also runs the other way, from the dark centre to the half-cycle phase rule. Two rivals, <i>pigmentModel</i> and <i>noPhaseShiftModel</i>, are refuted. Click any reading, law or set-up to remove it from the granted set and see which conclusions stop following (the Duhem&ndash;Quine effect). Hover anything for its statement.`,
